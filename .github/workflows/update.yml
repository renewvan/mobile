name: Publish update

# The test workflow is the gate: this runs only after it succeeded on main.
on:
  workflow_run:
    workflows: [Tests]
    branches: [main]
    types: [completed]
  # Production is a manual promotion of the update already on preview.
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: Republish the latest preview update to production
        type: boolean
        default: false

jobs:
  preview:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas update --branch preview --message "$GITHUB_SHA" --non-interactive

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_to_production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas update:republish --source-branch preview --destination-branch production --non-interactive
